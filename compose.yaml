name: kafkalab

# Error loops at DEBUG level once wrote ~30 GB of container logs in minutes; every container is capped.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "2" }

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 0@controller:9093
  CLUSTER_ID: a2Fma2FsYWJjbHVzdGVyMQ
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
  # Small values so failures show up in seconds instead of minutes.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

x-gap-svc: &gap-svc
  image: eclipse-temurin:21-jre-alpine
  command: ["java", "-jar", "/app/service.jar"]
  volumes:
    - ./build/service.jar:/app/service.jar:ro
  networks: [lab-kafka, lab-db]
  logging: *logging
  stop_grace_period: 10s
  depends_on: [kafka-1, kafka-2, kafka-3, timescaledb]

x-gap-svc-env: &gap-svc-env
  SPRING_PROFILES_ACTIVE: local
  # The local profile logs DEBUG/TRACE (SQL binds included); INFO keeps the log readable and small.
  LOGGING_LEVEL_DE_E21X_SERVICE_GAP: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE: INFO
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
  LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  SPRING_KAFKA_CONSUMER_GROUP_ID: ${SVC_GROUP_ID:-gap-lab}
  SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/postgres
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres
  DEFAULT_SCHEMA: traffic_data
  KAFKA_SHORT_TERM_TOPIC: lab.short-term
  PIPELINE_DLQ_ENABLED: ${SVC_DLQ_ENABLED:-false}
  JAVA_TOOL_OPTIONS: -Xmx384m ${SVC_EXTRA_OPTS:-}
  # Lab timings; production values are 30000 / 30 / 30 / 30000 / 300000.
  SPRING_APPLICATION_JSON: '{"spring":{"datasource":{"hikari":{"connection-timeout":5000,"data-source-properties":{"socketTimeout":5}}},"jdbc":{"template":{"query-timeout":5}}},"pipelines":{"error-handling":{"pause-duration-ms":10000,"max-pause-duration-ms":60000}}}'

services:
  controller:
    logging: *logging
    image: apache/kafka:3.9.0
    container_name: lab-controller
    networks: [lab-kafka]
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@controller:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      CLUSTER_ID: a2Fma2FsYWJjbHVzdGVyMQ
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

  kafka-1:
    logging: *logging
    image: apache/kafka:3.9.0
    container_name: lab-kafka-1
    networks: [lab-kafka]
    ports: ["127.0.0.1:19092:19092"]
    depends_on: [controller]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092

  kafka-2:
    logging: *logging
    image: apache/kafka:3.9.0
    container_name: lab-kafka-2
    networks: [lab-kafka]
    ports: ["127.0.0.1:19093:19093"]
    depends_on: [controller]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093

  kafka-3:
    logging: *logging
    image: apache/kafka:3.9.0
    container_name: lab-kafka-3
    networks: [lab-kafka]
    ports: ["127.0.0.1:19094:19094"]
    depends_on: [controller]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094

  kafka-ui:
    logging: *logging
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: lab-kafka-ui
    networks: [lab-kafka]
    ports: ["127.0.0.1:18080:8080"]
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092

  timescaledb:
    logging: *logging
    image: timescale/timescaledb:2.27.0-pg16
    container_name: lab-timescaledb
    networks: [lab-db]
    ports: ["127.0.0.1:15432:5432"]
    shm_size: 512m
    volumes:
      - ./db/init/10-catalog-tables.sql:/docker-entrypoint-initdb.d/010_catalog_tables.sql:ro
    environment:
      POSTGRES_PASSWORD: postgres

  gap-svc-1:
    <<: *gap-svc
    container_name: lab-gap-svc-1
    ports: ["127.0.0.1:18181:8181"]
    environment: { <<: *gap-svc-env, HOSTNAME: gap-svc-1 }

  gap-svc-2:
    <<: *gap-svc
    container_name: lab-gap-svc-2
    ports: ["127.0.0.1:18182:8181"]
    environment: { <<: *gap-svc-env, HOSTNAME: gap-svc-2 }

  gap-svc-3:
    <<: *gap-svc
    container_name: lab-gap-svc-3
    profiles: [scale]
    ports: ["127.0.0.1:18183:8181"]
    environment: { <<: *gap-svc-env, HOSTNAME: gap-svc-3 }

  gap-svc-4:
    <<: *gap-svc
    container_name: lab-gap-svc-4
    profiles: [scale]
    ports: ["127.0.0.1:18184:8181"]
    environment: { <<: *gap-svc-env, HOSTNAME: gap-svc-4 }

networks:
  lab-kafka:
    name: lab-kafka
  lab-db:
    name: lab-db
